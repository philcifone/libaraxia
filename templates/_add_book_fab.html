<!-- Floating Add Book Button with Expandable Menu -->
<div class="fixed bottom-6 right-6 z-50" id="fab-container">
    <!-- Sub-buttons (hidden by default, appear above main button) -->
    <div id="fab-menu" class="flex flex-col items-end gap-3 mb-3 opacity-0 pointer-events-none translate-y-4 transition-all duration-200">
        <a href="/books/add"
           class="font-display px-6 py-4 bg-accent hover:bg-accent-hover
                  text-white rounded-full font-bold shadow-lg
                  hover:scale-105 transition-all duration-300
                  flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
            <span class="text-lg">Add to Library</span>
        </a>
        <a href="/wishlist/view"
           class="font-display px-6 py-4 bg-accent hover:bg-accent-hover
                  text-white rounded-full font-bold shadow-lg
                  hover:scale-105 transition-all duration-300
                  flex items-center gap-2">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
            </svg>
            <span class="text-lg">Add to Wishlist</span>
        </a>
    </div>

    <!-- Main FAB button -->
    <button id="fab-toggle"
            onclick="toggleFabMenu()"
            class="font-display px-6 py-4 bg-accent hover:bg-accent-hover
                   text-white rounded-full font-bold shadow-lg
                   hover:scale-105 transition-all duration-300
                   flex items-center gap-2">
        <span id="fab-icon" class="text-lg transition-transform duration-200">+</span>
        <span class="text-lg">Add Book</span>
    </button>
</div>

<!-- Backdrop overlay -->
<div id="fab-backdrop"
     class="fixed inset-0 z-40 hidden"
     onclick="closeFabMenu()"></div>

<script>
    let fabOpen = false;

    function toggleFabMenu() {
        fabOpen = !fabOpen;
        const menu = document.getElementById('fab-menu');
        const icon = document.getElementById('fab-icon');
        const backdrop = document.getElementById('fab-backdrop');

        if (fabOpen) {
            menu.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            menu.classList.add('opacity-100', 'pointer-events-auto', 'translate-y-0');
            icon.style.transform = 'rotate(45deg)';
            backdrop.classList.remove('hidden');
        } else {
            closeFabMenu();
        }
    }

    function closeFabMenu() {
        fabOpen = false;
        const menu = document.getElementById('fab-menu');
        const icon = document.getElementById('fab-icon');
        const backdrop = document.getElementById('fab-backdrop');

        menu.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
        menu.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
        icon.style.transform = 'rotate(0deg)';
        backdrop.classList.add('hidden');
    }
</script>
