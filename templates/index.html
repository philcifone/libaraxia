<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>libaraxia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
</head>

<body class="bg-primary text-content-primary p-6">
    {% include '_sidebar.html' %}

    <!-- Flash Messages -->
    {% include '_flash_messages.html' %}

    <!-- Floating Add Button -->
    {% include '_add_book_fab.html' %}

    <!-- Library View Tabs -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-20 pb-4">
        <div class="bg-secondary rounded-xl shadow-lg overflow-hidden border border-rule-strong">
            <div class="flex items-stretch">
                <a href="{{ url_for('base.index') }}"
                   class="tab tab-active" aria-current="page">
                    <span class="text-center">My Library</span>
                </a>
                <a href="{{ url_for('base.shared_library') }}"
                   class="tab">
                    <span class="text-center">Shared<span class="hidden sm:inline"> Library</span></span>
                </a>
                <a href="{{ url_for('base.friends_libraries') }}"
                   class="tab">
                    <span class="text-center">Friends'<span class="hidden sm:inline"> Libraries</span></span>
                </a>
            </div>
        </div>
    </div>

    {% include '_search_sort_filter.html' %}

    {% include '_book_grid.html' %}


    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
