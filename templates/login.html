{% extends 'base.html' %}

{% block title %}Login - Libaraxia{% endblock %}
{% block html_class %}h-full bg-primary-bg{% endblock %}
{% block body_class %}h-full{% endblock %}
{% block sidebar %}{% endblock %}

{% block content %}
    <div class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-md">
            <h1 class="text-center text-3xl font-display text-content-primary">
                Libaraxia
            </h1>
            <h2 class="mt-6 text-center text-2xl font-medium text-content-secondary">
                Sign in to your account
            </h2>
        </div>

        <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
            <div class="bg-secondary-bg py-8 px-4 rounded-lg sm:px-10 card">
                <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-6">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div>
                        <label for="email" class="block text-sm font-medium text-content-secondary">
                            Email
                        </label>
                        <div class="mt-1">
                            <input id="email" name="email" type="email" required 
                                class="appearance-none block w-full px-3 py-2 border border-rule-strong rounded-md 
                                shadow-sm bg-primary-bg text-content-primary placeholder-gray-400 
                                focus:outline-none focus:ring-2 focus:ring-accent focus:border-accent">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-content-secondary">
                            Password
                        </label>
                        <div class="mt-1">
                            <input id="password" name="password" type="password" required 
                                class="appearance-none block w-full px-3 py-2 border border-rule-strong rounded-md 
                                shadow-sm bg-primary-bg text-content-primary placeholder-gray-400 
                                focus:outline-none focus:ring-2 focus:ring-accent focus:border-accent">
                        </div>
                    </div>

                    <div class="flex items-center">
                        <input id="remember_me" name="remember_me" type="checkbox"
                            class="h-4 w-4 rounded border-rule-strong bg-primary-bg text-accent focus:ring-accent">
                        <label for="remember_me" class="ml-2 block text-sm text-content-secondary">
                            Remember me
                        </label>
                    </div>

                    <div>
                        <button type="submit"
                            class="w-full flex justify-center py-2 px-4 rounded-md text-sm font-medium text-on-accent bg-accent hover:bg-accent-hover focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent btn">
                            Sign in
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
