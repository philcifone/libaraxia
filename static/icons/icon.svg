       library-house glyph (_icons.html) on Gruvbox dark, the house in fg,
       the books in green. Square and full-bleed: the phone rounds or circles
       it itself. The glyph sits inside the middle 80% circle, the safe zone
       Android keeps when it masks a "maskable" icon. The PNGs are rendered
       from this file (static/icons/README.md). -->
